metadata:
  purpose: "Record parameters tuned during weak-network video development."
  runtime_loaded: false
  updated_at: "2026-06-15"
  units_note: "Bitrates are kbps unless a different unit is stated."

current:
  runtime:
    config_file: runtime-config.yaml
    config_location: "Directory containing the executable."
    command_line_parameters: [role]
    missing_config_behavior: "Use compiled defaults."
    compiled_fallback:
      sender_input: camera
      sender_connect: "127.0.0.1:9000"
      receiver_listen: "0.0.0.0:9000"
    transport:
      mode: udp
      selectable_modes: [udp, srt]
      feedback_interval_ms: 200
      feedback_redundancy: 10
      feedback_timeout_ms: 1000
    sender:
      input: file
      connect: "10.88.0.2:9000"
      video_file: "/home/u20/code/jetson-2k.mp4"
      camera:
        device: /dev/video0
        pixel_format: yuyv422
        width: 640
        height: 480
        fps: 30
      max_video_kbps: 2000
    receiver:
      listen: "10.88.0.2:9000"
      display: true
      output_width: 640
      output_height: 360
      write_h264: true
      output_file: received.h264

  srt:
    role: "Optional compatibility transport."
    transport_type: live
    message_api: true
    timestamp_based_delivery: true
    too_late_packet_drop: true
    nak_report: false
    latency_ms: 350
    receive_timeout_ms: 200
    send_timeout_ms: 200
    peer_idle_timeout_ms: 15000
    payload_size_bytes: 1200
    send_drop_delay_ms: 0
    flow_control_packets: 512
    send_buffer_bytes: 524288
    max_bandwidth_bytes_per_second: 375000
    synchronous_send: false
    synchronous_receive: false
    reuse_address: true
    media_message_ttl_ms: 320
    network_report_ttl_ms: 1500

  sender:
    reconnect:
      initial_delay_ms: 100
      maximum_delay_ms: 1000
      backoff_multiplier: 2
      preserve_last_receiver_loss: true
    statistics_interval_ms: 1000
    receiver_loss_freshness_ms: 12000
    send_retry:
      attempts_per_shard: 20
      retry_delay_ms: 2
    would_block:
      synthetic_loss_percent: 100
      synthetic_rtt_ms: 500
      retry_delay_ms: 100
    udp:
      socket_send_buffer_bytes: 4194304
      socket_receive_buffer_bytes: 4194304
      feedback_loss_minimum_packets: 32
      feedback_loss_ewma_previous_weight: 0.8
      weak_network_enter_loss_percent: 60
      weak_network_exit_loss_below_percent: 50
      weak_network_exit_consecutive_windows: 5
      recovery_feedback_timeout_ms: 1000
      recovery_receiver_frame_age_ms: 1500
      recovery_profile: {bitrate_kbps: 8, fps: 1, width: 128, height: 72, fec_ratio: 20.0, all_intra: true}
      loss_70_profile: {bitrate_kbps: 50, fps: 1, width: 320, height: 180, fec_ratio: 8.0, all_intra: true}
      loss_80_profile: {bitrate_kbps: 20, fps: 1, width: 160, height: 90, fec_ratio: 15.0, all_intra: true}

  receiver:
    timeout_poll_delay_ms: 2
    frame_assembly_timeout_ms: 450
    completed_frame_history_ms: 2000
    statistics_interval_ms: 1000
    receive_stall_threshold_ms: 3000
    receive_stall_loss_percent: 100
    loss_estimator:
      minimum_resolved_packets: 400
      source_received_packets: pktRecvUniqueTotal
      source_dropped_packets: pktRcvDropTotal
      source_missing_packets: pktRcvLossTotal
      reset_batch_after_stall: true
    frame_continuity_gate:
      enabled: true
      action_on_frame_id_gap: "Drop non-keyframes until the next complete keyframe."
    udp:
      feedback_copy_spacing_ms: 20
      keyframe_request_frame_age_ms: 1500
      packet_sequence_history: 20000
      maximum_blocks_per_frame: 64

  adaptation:
    max_video_kbps:
      minimum: 8
      maximum: 2000
      default: 2000
    healthy_window:
      loss_below_percent: 3
      rtt_below_ms: 130
      consecutive_windows: 5
    degradation: "Immediately jump to the required lower-quality level."
    normal_recovery: "Recover one level after five healthy windows."
    emergency_recovery: "Recover one level every five stable windows until the current network-required level."
    loss_thresholds:
      - {greater_than_percent: 3, level: 1}
      - {greater_than_percent: 7, level: 2}
      - {greater_than_percent: 15, level: 3}
      - {greater_than_percent: 30, level: 4}
      - {greater_than_percent: 50, level: 5}
      - {greater_than_percent: 70, level: 6}
      - {greater_than_percent: 80, level: 7}
      - {greater_than_percent: 90, level: 8}
    rtt_minimum_levels:
      - {greater_than_ms: 150, minimum_level: 3}
      - {greater_than_ms: 220, minimum_level: 5}
      - {greater_than_ms: 300, minimum_level: 6}
      - {greater_than_ms: 400, minimum_level: 7}
    profiles:
      - {level: 0, bitrate_kbps: 2000, fps: 30, width: 1280, height: 720, fec_ratio: 0.15, all_intra: false}
      - {level: 1, bitrate_kbps: 1400, fps: 20, width: 1280, height: 720, fec_ratio: 0.25, all_intra: false}
      - {level: 2, bitrate_kbps: 900, fps: 10, width: 960, height: 540, fec_ratio: 0.50, all_intra: false}
      - {level: 3, bitrate_kbps: 500, fps: 5, width: 640, height: 360, fec_ratio: 0.75, all_intra: false}
      - {level: 4, bitrate_kbps: 250, fps: 3, width: 426, height: 240, fec_ratio: 1.00, all_intra: false}
      - {level: 5, bitrate_kbps: 120, fps: 2, width: 426, height: 240, fec_ratio: 2.00, all_intra: true}
      - {level: 6, bitrate_kbps: 50, fps: 1, width: 320, height: 180, fec_ratio: 3.00, all_intra: true}
      - {level: 7, bitrate_kbps: 20, fps: 1, width: 160, height: 90, fec_ratio: 5.00, all_intra: true}
      - {level: 8, bitrate_kbps: 8, fps: 1, width: 128, height: 72, fec_ratio: 11.00, all_intra: true}

  fec:
    target_shard_bytes: 1000
    maximum_total_shards: 255
    minimum_data_shards_per_block: 4
    multiple_blocks_per_frame: true

  protocol:
    version: 3
    shard_header_bytes: 98
    encoded_timestamp: encoded_at_unix_us
    source_processing_duration: source_to_encoded_us
    udp_session_fields:
      - session_id
      - session_started_unix_us
      - packet_sequence
      - sent_monotonic_us
      - block_index
      - block_count
      - block_original_size
    udp_feedback_fields:
      - highest_packet_sequence
      - unique_packets
      - received_bytes
      - last_complete_frame_id
      - echoed_sender_monotonic_us
      - last_frame_age_ms
      - request_keyframe
    clock_requirement: "Sender and receiver CLOCK_REALTIME synchronized by NTP or PTP."
    backward_compatible: false

  latency_metrics:
    runtime_config_file: runtime-config.yaml
    default_metric: encode_to_decode
    selectable_metrics:
      - encode_to_assemble
      - encode_to_decode
      - source_to_display
    simultaneously_reported_metrics: 1
    rolling_window_seconds: 10
    statistics_interval_ms: 1000
    maximum_valid_sample_ms: 60000
    invalid_negative_samples: discard
    source_to_display_headless_value: "n/a"
    source_to_display_endpoint: SDL_RenderPresent

  netem_script:
    left_namespace: webrtc_tx
    right_namespace: webrtc_rx
    left_interface: veth_tx
    right_interface: veth_rx
    left_address: "10.88.0.1/24"
    right_address: "10.88.0.2/24"
    default_loss_direction: tx
    bandwidth_units_examples: [500kbit, 2mbit, 1gbit]
    permanent_neighbor_entries: true

development_history:
  - parameter: primary_transport
    previous: "SRT caller/listener was the only media transport."
    current:
      default: udp
      optional: srt
      udp_connection_state: none
    reason: "Remove SRT handshake, peer-idle disconnect, and reconnect delays under 70-80 percent bidirectional loss."

  - parameter: udp_recovery_state
    previous: "A stalled SRT socket forced the normal adaptation controller to Level 8 and then reconnected."
    current:
      trigger: "Cold start, feedback timeout, receiver frame age above 1500 ms, or smoothed loss above 85 percent."
      exit: "A recovery frame is acknowledged by at least two fresh feedback reports."
      profile: "8kbps/1fps/128x72, all-intra, FEC ratio 20."
    reason: "Recover a complete keyframe without waiting for a transport connection."

  - parameter: udp_high_loss_profiles
    previous: "70 percent used FEC ratio 3 and 80 percent used FEC ratio 5."
    current:
      loss_70: "50kbps/1fps/320x180, FEC ratio 8."
      loss_80: "20kbps/1fps/160x90, FEC ratio 15."
      loss_above_85: "Recovery profile with FEC ratio 20."
    reason: "Keep complete-frame failure probability low enough for a three-second frame-gap target."

  - parameter: fec_frame_layout
    previous: "One frame was limited to one Reed-Solomon block and 255 total shards."
    current: "A frame may contain up to 64 independently recoverable blocks; every block has at least four data shards."
    reason: "Support 15-20x parity without limiting encoded frame size to one small block."

  - parameter: protocol_version
    previous: 2
    current: 3
    reason: "Carry UDP session, packet sequence, feedback echo, and multi-block FEC metadata."

  - parameter: netem_neighbor_resolution
    previous: "ARP requests and responses were subjected to the configured netem loss."
    current: "ns-up installs permanent neighbor entries for both veth endpoints."
    reason: "Measure media recovery rather than random ARP cold-start delay at 70-80 percent bidirectional loss."

  - parameter: receiver_display_size
    previous: "The SDL window and texture followed each decoded frame resolution."
    current:
      output_width: 640
      output_height: 360
      scaling: bilinear
      scope: display_only
    reason: "Keep the displayed picture at a stable size while adaptive profiles change encoded resolution."

  - parameter: sender_video_input
    previous: "Only a looping local video file was supported."
    current:
      selectable_inputs: [camera, file]
      default_input: camera
      camera:
        api: V4L2
        device: /dev/video0
        pixel_format: yuyv422
        width: 640
        height: 480
        fps: 30
      file: "/home/u20/code/jetson-2k.mp4"
    reason: "Transmit live frames from the attached USB camera while retaining file-based test input."

  - parameter: runtime_configuration_source
    previous: "Endpoint, media path, bitrate limit, output path, and display mode were command-line parameters."
    current: "All startup settings are loaded from runtime-config.yaml; command line accepts only role."
    reason: "Keep startup behavior reproducible and centralize runtime parameters."

  - parameter: receiver_h264_output
    previous: "The receiver always created and wrote the configured H.264 file."
    current:
      write_h264: true
      output_file: received.h264
    reason: "Allow disabling disk output while preserving decode, display, and statistics; retain writing as the default."

  - parameter: SRTO_PEERIDLETIMEO
    previous: 5000
    current: 15000
    unit: ms
    reason: "Five seconds was too sensitive to temporary silence under 50 percent bidirectional loss."

  - parameter: receiver_receive_stall_threshold
    previous: 2000
    current: 3000
    unit: ms
    reason: "Reduce false 100 percent loss reports during short packet gaps."

  - parameter: reconnect_loss_initialization
    previous: "Clear receiver loss and use the new SRT short-window sender statistic."
    current: "Preserve the last reliable receiver-side loss until a new report arrives."
    reason: "Avoid several seconds of near-100 percent loss immediately after reconnect."

  - parameter: loss_estimation
    previous_stages:
      - "Sender pktSndLoss divided by sent plus lost packets."
      - "Receiver one-second samples, which were unstable at low bitrate."
      - "Five-second rolling window with at least 100 packets."
      - "Ten-second rolling window with at least 200 packets."
    current: "Receiver cumulative batches of at least 400 resolved original packets."
    reason: "Track injected link loss without retransmission-window skew or small-sample spikes."

  - parameter: loss_estimator_stall_handling
    previous: "Keep the stalled interval in the next loss batch."
    current: "Report 100 percent while stalled, then reset the batch when packet progress resumes."
    reason: "Prevent the first post-stall report from remaining close to 100 percent."

  - parameter: emergency_profile_recovery
    previous: "All recovery required loss below 3 percent and RTT below 130 ms."
    current: "An emergency Level 8 can recover every five stable windows to the level required by the current network."
    reason: "Prevent a temporary stall or WouldBlock event from permanently trapping video at the emergency level."

  - parameter: adaptation_ladder
    previous_profiles:
      - {level: 0, bitrate_kbps: 2000, fps: 30, width: 1280, height: 720, fec_ratio: 0.15, all_intra: false}
      - {level: 1, bitrate_kbps: 1200, fps: 24, width: 960, height: 540, fec_ratio: 0.25, all_intra: false}
      - {level: 2, bitrate_kbps: 600, fps: 15, width: 640, height: 360, fec_ratio: 0.50, all_intra: false}
      - {level: 3, bitrate_kbps: 300, fps: 10, width: 426, height: 240, fec_ratio: 1.00, all_intra: false}
      - {level: 4, bitrate_kbps: 150, fps: 5, width: 320, height: 180, fec_ratio: 1.50, all_intra: false}
      - {level: 5, bitrate_kbps: 50, fps: 2, width: 160, height: 90, fec_ratio: 3.00, all_intra: true}
      - {level: 6, bitrate_kbps: 8, fps: 1, width: 128, height: 72, fec_ratio: 11.00, all_intra: true}
    current_profile_count: 9
    reason: "Prefer bitrate and frame-rate reductions before large resolution changes, while retaining three emergency levels."

  - parameter: rtt_level_mapping
    previous:
      - {greater_than_ms: 150, minimum_level: 2}
      - {greater_than_ms: 220, minimum_level: 4}
      - {greater_than_ms: 350, minimum_level: 5}
    current:
      - {greater_than_ms: 150, minimum_level: 3}
      - {greater_than_ms: 220, minimum_level: 5}
      - {greater_than_ms: 300, minimum_level: 6}
      - {greater_than_ms: 400, minimum_level: 7}

  - parameter: latency_metric_reporting
    previous: "Only SRT RTT was reported; no media one-way latency metric."
    current: "Select exactly one of encode_to_assemble, encode_to_decode, or source_to_display; default encode_to_decode."
    rolling_window_seconds: 10
    outputs: [latency_avg, latency_p95, latency_invalid]
    reason: "Separate SRT round-trip time from media pipeline latency without affecting adaptation."

  - parameter: media_timestamp_protocol
    previous: {protocol_version: 1, timestamp: steady_clock_pts_us}
    current:
      protocol_version: 2
      encoded_timestamp: encoded_at_unix_us
      source_processing_duration: source_to_encoded_us
    reason: "Support one-way latency measurement across NTP/PTP-synchronized hosts."

  - parameter: latency_sample_validation
    previous: "No media latency validation."
    current:
      maximum_valid_sample_ms: 60000
      negative_sample_action: discard
      invalid_counter: latency_invalid
    reason: "Reject clock jumps, synchronization errors, and malformed timestamps."

  - parameter: receiver_frame_continuity_gate
    previous: "Any complete CRC-valid P-frame could be decoded after a missing reference frame."
    current: "A frame ID gap clears decoder synchronization; non-keyframes are dropped until the next complete keyframe."
    reason: "Prevent decoder errors and corrupted reference chains during abrupt packet loss."

validation_scenarios:
  - {transport: udp, loss_percent: 70, delay_ms: 50, direction: both, duration_seconds: 600, frames: 573, dropped_frames: 1, max_frame_gap_ms: 2062, decoder_errors: 0, ffmpeg_strict: passed}
  - {transport: udp, loss_percent: 80, delay_ms: 50, direction: both, duration_seconds: 600, frames: 574, dropped_frames: 1, max_frame_gap_ms: 2069, decoder_errors: 0, ffmpeg_strict: passed}
  - {transport: udp, scenario: cold_start, loss_percent: 70, runs: 10, passed_under_3000_ms: 10, worst_first_frame_ms: 738}
  - {transport: udp, scenario: cold_start, loss_percent: 80, runs: 10, passed_under_3000_ms: 10, worst_first_frame_ms: 726}
  - {transport: udp, scenario: "0% to impaired transition", loss_percent: 70, runs: 5, passed_under_3000_ms: 5, worst_frame_gap_ms: 2096}
  - {transport: udp, scenario: "0% to impaired transition", loss_percent: 80, runs: 5, passed_under_3000_ms: 5, worst_frame_gap_ms: 2050}
  - {transport: udp, transition: "0% to 70% bidirectional loss, 50ms delay", duration_seconds: 38, max_frame_gap_ms: 2067, decoder_errors: 0}
  - {transport: udp, loss_percent: 70, delay_ms: 50, direction: both, duration_seconds: 35, profile: "320x180/1fps/FEC8", max_frame_gap_ms: 1083, decoder_errors: 0}
  - {transport: udp, loss_percent: 80, delay_ms: 50, direction: both, duration_seconds: 35, profile: "160x90/1fps/FEC15", max_frame_gap_ms: 1092, decoder_errors: 0}
  - {transport: srt, loss_percent: 0, result: "Protocol v3 and multi-block FEC regression passed with decoder_errors=0 and FFmpeg-valid H.264."}
  - {encoded_resolution: "128x72", display_resolution: "640x360", result: "X11 reported a fixed 640x360 window with decoder_errors=0."}
  - {input: camera, device: /dev/video0, capture: "640x480/30fps YUYV", result: "Rendered continuously with decoder_errors=0 and FFmpeg-valid H.264 output."}
  - {loss_percent: 30, delay_ms: 50, direction: both, expected_profile: "426x240/2fps/120kbps"}
  - {loss_percent: 50, delay_ms: 50, direction: both, expected_profile_range: "426x240 at 120-250kbps"}
  - {loss_percent: 71, delay_ms: 50, direction: tx, expected_resolution: "320x180"}
  - {loss_percent: 81, delay_ms: 50, direction: tx, expected_resolution: "160x90"}
  - {loss_percent: 91, delay_ms: 50, direction: tx, expected_resolution: "128x72 or 160x90 near the strict 90 percent boundary"}
