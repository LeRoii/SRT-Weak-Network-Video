metadata:
  purpose: "Record parameters tuned during weak-network video development."
  runtime_loaded: false
  updated_at: "2026-07-14"
  units_note: "Bitrates are kbps unless a different unit is stated."

current:
  runtime:
    config_file: runtime-config.yaml
    config_location: "Directory containing the executable."
    command_line_parameters: [role]
    missing_config_behavior: "Use compiled defaults. Empty and partial YAML files are allowed; present keys override defaults and omitted keys keep defaults."
    compiled_fallback:
      sender_input: file
      sender_connect: "10.88.0.2:9000"
      sender_video_file: "/home/u20/code/jetson-2k.mp4"
      receiver_listen: "10.88.0.2:9000"
    transport:
      mode: udp
      selectable_modes: [udp, srt]
      feedback_interval_ms: 200
      feedback_redundancy: 10
      feedback_timeout_ms: 1000
    sender:
      input: file
      connect: "10.88.0.2:9000"
      video_file: "/home/u20/code/jetson-2k.mp4"
      camera:
        device: /dev/video0
        pixel_format: yuyv422
        width: 640
        height: 480
        fps: 30
      max_video_kbps: 2000
    receiver:
      listen: "10.88.0.2:9000"
      display: true
      minimum_output_width: 640
      minimum_output_height: 360
      minimum_output_fps: 30
      upscale_mode: lanczos_sharpen
      selectable_upscale_modes: [bilinear, lanczos_sharpen]
      interpolation_mode: blend
      selectable_interpolation_modes: [repeat, blend]
      write_h264: true
      output_file: received.h264

  srt:
    role: "Optional compatibility transport."
    transport_type: live
    message_api: true
    timestamp_based_delivery: true
    too_late_packet_drop: true
    nak_report: false
    latency_ms: 350
    receive_timeout_ms: 200
    send_timeout_ms: 200
    peer_idle_timeout_ms: 15000
    payload_size_bytes: 1200
    send_drop_delay_ms: 0
    flow_control_packets: 512
    send_buffer_bytes: 524288
    max_bandwidth_bytes_per_second: 375000
    synchronous_send: false
    synchronous_receive: false
    reuse_address: true
    media_message_ttl_ms: 320
    network_report_ttl_ms: 1500

  sender:
    reconnect:
      initial_delay_ms: 100
      maximum_delay_ms: 1000
      backoff_multiplier: 2
      preserve_last_receiver_loss: true
    statistics_interval_ms: 1000
    receiver_loss_freshness_ms: 12000
    send_retry:
      attempts_per_shard: 20
      retry_delay_ms: 2
    would_block:
      synthetic_loss_percent: 100
      synthetic_rtt_ms: 500
      retry_delay_ms: 100
    file_input_pacing:
      mode: absolute_deadline
      processing_time_subtracted_from_sleep: true
      late_frame_policy: reset_deadline_no_burst
      applies_to: [udp, srt]
    camera_input_pacing: "V4L2 capture cadence; no sender-side post-send frame sleep."
    udp:
      socket_send_buffer_bytes: 4194304
      socket_receive_buffer_bytes: 4194304
      feedback_loss_minimum_packets: 32
      feedback_loss_ewma_previous_weight: 0.8
      recovery_feedback_timeout_ms: 1000
      recovery_receiver_frame_age_ms: 1500
      recovery_profile: {level: 8, bitrate_kbps: 60, fps: 30, width: 160, height: 90, gop_frames: 1, min_data_shards: 1, p_frame_fec_ratio: 12.0, keyframe_fec_ratio: 12.0, all_intra: true}
      missing_feedback_starts_recovery: false
      missing_feedback_probe_profile: {level: 8, bitrate_kbps: 60, fps: 30, width: 160, height: 90, gop_frames: 1, min_data_shards: 1, p_frame_fec_ratio: 12.0, keyframe_fec_ratio: 12.0, all_intra: true}
      adaptation_feedback_sequence_deduplication: true

  receiver:
    timeout_poll_delay_ms: 2
    frame_assembly_timeout_ms: 450
    completed_frame_history_ms: 2000
    statistics_interval_ms: 1000
    receive_stall_threshold_ms: 3000
    receive_stall_loss_percent: 100
    loss_estimator:
      minimum_resolved_packets: 400
      source_received_packets: pktRecvUniqueTotal
      source_dropped_packets: pktRcvDropTotal
      source_missing_packets: pktRcvLossTotal
      reset_batch_after_stall: true
    frame_continuity_gate:
      enabled: true
      action_on_frame_id_gap: "Drop non-keyframes until the next complete keyframe."
    udp:
      feedback_copy_spacing_ms: 20
      keyframe_request_frame_age_ms: 1500
      packet_sequence_history: 20000
      maximum_blocks_per_frame: 64

  adaptation:
    max_video_kbps:
      minimum: 60
      maximum: 2000
      default: 2000
    healthy_window:
      loss_below_percent: 5
      rtt_below_ms: 130
      consecutive_windows: 5
    degradation: "Immediately jump for Level 1, Level 3, Level 4, and Level 6+ loss; Level 2 and Level 5 loss require sustained confirmation unless their immediate-entry thresholds are exceeded; RTT-only degradation requires sustained confirmation."
    normal_recovery: "Recover one level after five stable feedback windows whenever the hysteresis-adjusted network-required level is lower than the active level."
    emergency_recovery: "Recover one level every five stable windows until the current network-required level."
    loss_confirmation:
      level_2_windows: 3
      level_5_windows: 3
      level_5_confirmed_entry_above_percent: 55
      level_5_immediate_entry_above_percent: 60
    loss_recovery_hysteresis:
      level_2_to_1_below_percent: 12
      level_5_to_4_below_percent: 50
      level_1_to_0_below_percent: 3
    loss_thresholds:
      - {greater_than_percent: 5, level: 1}
      - {greater_than_percent: 15, level: 2}
      - {greater_than_percent: 20, level: 3}
      - {greater_than_percent: 30, level: 4}
      - {greater_than_percent: 50, level: 5}
      - {greater_than_percent: 65, level: 6}
      - {greater_than_percent: 72, level: 7}
      - {greater_than_percent: 77, level: 8}
    rtt_confirmation_windows: 5
    rtt_minimum_levels:
      - {greater_than_ms: 160, minimum_level: 3}
      - {greater_than_ms: 220, minimum_level: 5}
      - {greater_than_ms: 300, minimum_level: 6}
      - {greater_than_ms: 400, minimum_level: 7}
    profiles:
      - {level: 0, bitrate_kbps: 2000, fps: 30, width: 1280, height: 720, gop_frames: 30, min_data_shards: 4, p_frame_fec_ratio: 0.10, keyframe_fec_ratio: 0.30, all_intra: false}
      - {level: 1, bitrate_kbps: 900, fps: 30, width: 640, height: 360, gop_frames: 10, min_data_shards: 4, p_frame_fec_ratio: 0.50, keyframe_fec_ratio: 0.75, all_intra: false}
      - {level: 2, bitrate_kbps: 700, fps: 30, width: 640, height: 360, gop_frames: 8, min_data_shards: 4, p_frame_fec_ratio: 0.75, keyframe_fec_ratio: 1.00, all_intra: false}
      - {level: 3, bitrate_kbps: 500, fps: 30, width: 512, height: 288, gop_frames: 6, min_data_shards: 3, p_frame_fec_ratio: 1.00, keyframe_fec_ratio: 2.00, all_intra: false}
      - {level: 4, bitrate_kbps: 350, fps: 30, width: 320, height: 180, gop_frames: 1, min_data_shards: 1, p_frame_fec_ratio: 3.00, keyframe_fec_ratio: 4.00, all_intra: true}
      - {level: 5, bitrate_kbps: 300, fps: 30, width: 320, height: 180, gop_frames: 1, min_data_shards: 1, p_frame_fec_ratio: 5.00, keyframe_fec_ratio: 6.00, all_intra: true}
      - {level: 6, bitrate_kbps: 260, fps: 28, width: 320, height: 180, gop_frames: 1, min_data_shards: 1, p_frame_fec_ratio: 7.00, keyframe_fec_ratio: 8.00, all_intra: true}
      - {level: 7, bitrate_kbps: 240, fps: 26, width: 320, height: 180, gop_frames: 1, min_data_shards: 1, p_frame_fec_ratio: 10.00, keyframe_fec_ratio: 10.00, all_intra: true}
      - {level: 8, bitrate_kbps: 220, fps: 24, width: 320, height: 180, gop_frames: 1, min_data_shards: 1, p_frame_fec_ratio: 12.00, keyframe_fec_ratio: 12.00, all_intra: true}
    gop_policy: "Levels 1 through 3 use short GOPs while preserving P-frame compression; Levels 4 through 8 are all-intra to prevent reference-chain corruption under high loss."

  fec:
    target_shard_bytes: 1000
    maximum_total_shards: 255
    minimum_data_shards_per_block:
      profile_controlled: true
      default_profiles_0_to_2: 4
      mid_profile_3: 3
      severe_profiles_4_to_8: 1
      emergency_profiles_7_to_8: 1
    multiple_blocks_per_frame: true

  protocol:
    version: 4
    shard_header_bytes: 98
    encoded_timestamp: encoded_at_unix_us
    source_processing_duration: source_to_encoded_us
    udp_session_fields:
      - session_id
      - session_started_unix_us
      - packet_sequence
      - sent_monotonic_us
      - block_index
      - block_count
      - block_original_size
    udp_probe_fields:
      - session_id
      - session_started_unix_us
      - probe_sequence
      - sender_monotonic_us
    udp_feedback_fields:
      - highest_packet_sequence
      - unique_packets
      - received_bytes
      - last_complete_frame_id
      - echoed_sender_monotonic_us
      - last_frame_age_ms
      - request_keyframe
    rtt_source: "Independent UDP probe echo sent from the UDP feedback/control thread; media shard sent_monotonic_us is retained for diagnostics but not used for adaptation RTT."
    clock_requirement: "RTT uses echoed sender monotonic timestamps and does not require synchronized sender/receiver clocks."
    backward_compatible: false

  latency_metrics:
    runtime_config_file: runtime-config.yaml
    default_metric: encode_to_decode
    selectable_metrics:
      - encode_to_assemble
      - encode_to_decode
      - source_to_display
    simultaneously_reported_metrics: 1
    rolling_window_seconds: 10
    statistics_interval_ms: 1000
    receiver_log_fields: [latency_avg, latency_p95, latency_max, latency_samples, latency_invalid]
    p95_calculation: nearest_rank
    maximum_valid_sample_ms: 60000
    invalid_negative_samples: discard
    source_to_display_headless_value: "n/a"
    source_to_display_endpoint: SDL_RenderPresent

  display_post_processing:
    scope: display_only
    preserve_decoded_resolution_at_or_above_minimum: true
    preserve_decoded_fps_at_or_above_minimum: true
    minimum_output_width: 640
    minimum_output_height: 360
    minimum_output_fps: 30
    aspect_ratio_preserved: true
    default_upscale_mode: lanczos_sharpen
    selectable_upscale_modes: [bilinear, lanczos_sharpen]
    lanczos_sharpen_scope: luma_contrast_stretch_then_luma_after_upscale
    default_interpolation_mode: blend
    selectable_interpolation_modes: [repeat, blend]
    blend_weights: [0.5, 0.5]
    prolonged_gap_fallback: repeat_last_complete_frame
    processed_h264_output: false
    log_fields: [decoded_fps, output_fps, synthetic_fps, output_resolution]

  netem_script:
    left_namespace: webrtc_tx
    right_namespace: webrtc_rx
    left_interface: veth_tx
    right_interface: veth_rx
    left_address: "10.88.0.1/24"
    right_address: "10.88.0.2/24"
    default_loss_direction: tx
    bandwidth_units_examples: [500kbit, 2mbit, 1gbit]
    permanent_neighbor_entries: true

  acceptance:
    runner: scripts/weaknet_acceptance.py
    output_root_default: "/tmp/weaknet-acceptance-YYYYmmdd-HHMMSS"
    video_file: "/home/u20/code/jetson-2k.mp4"
    receiver_output_file: "scenario directory / received.h264"
    transport: udp
    direction: both
    delay_ms: 50
    startup_seconds: 5
    tc01_video_profile_bitrate_only: true
    tc06_excluded: true
    tc08_hard_metric: "latency_avg <= 500ms"
    tc08_below_180ms: "reported as better-than-target latency, not a failure"
    tc08_report_only_metrics: [latency_p95, latency_max]
    tc07_downgrade_window_seconds: 3.0
    tc07_upgrade_window_seconds: 15.0
    tc09_hard_metric: "At 80 percent steady loss, post-warmup average decoded_fps >= 20, output_fps >= 28, synthetic_fps <= 10, and output_resolution == 640x360."
    receiver_display_for_headless_acceptance: {display: true, sdl_video_driver: dummy}
    reported_output_metrics: [decoded_fps, output_fps, synthetic_fps, decoded_fps_min, output_fps_min, fps_warmup_start_elapsed, output_resolution]
    ffmpeg_strict_command: "ffmpeg -v error -err_detect explode -i received.h264 -f null -"
    suites:
      quick:
        steady_losses_percent: [0, 20, 30, 45, 50, 65, 70, 80]
        steady_duration_seconds: 60
        staircase_losses_percent: [0, 10, 30, 50, 65, 70, 80, 50, 10, 0]
        staircase_step_seconds: 30
      full:
        steady_losses_percent: [0, 5, 15, 20, 30, 35, 45, 50, 60, 65, 70, 80, 85]
        steady_duration_seconds: 600
        staircase_losses_percent: [0, 5, 10, 15, 20, 30, 35, 45, 50, 60, 65, 70, 80, 85, 80, 70, 65, 60, 50, 45, 35, 30, 20, 10, 5, 0]
        staircase_step_seconds: 60
      extreme:
        steady_losses_percent: [90]
        optimization_required: false

development_history:
  - parameter: runtime_config_compiled_defaults
    previous:
      fallback_sender_input: camera
      fallback_sender_connect: "127.0.0.1:9000"
      fallback_receiver_listen: "0.0.0.0:9000"
      parser_requirement: "When a config file existed, it had to contain transport, sender, receiver, and latency sections."
    current:
      fallback_source: "Every runtime-config.yaml field is hardcoded in RuntimeConfig defaults using the checked-in YAML values."
      fallback_sender_input: file
      fallback_sender_connect: "10.88.0.2:9000"
      fallback_receiver_listen: "10.88.0.2:9000"
      parser_requirement: "Missing files use defaults when allowed by the caller; empty and partial YAML files load successfully, and present keys override the defaults."
    reason: "Allow the program to run even when runtime-config.yaml is empty or only contains overrides, while keeping the checked-in YAML as the visible default template."

  - parameter: loss80_quality_fps_rebalance
    previous:
      level_5: "220kbps/30fps/256x144, all-intra, FEC ratios 5/6"
      level_6: "150kbps/30fps/256x144, all-intra, FEC ratios 7/8"
      level_7: "90kbps/30fps/192x108, all-intra, FEC ratios 10/10"
      level_8: "60kbps/30fps/160x90, all-intra, FEC ratios 12/12"
      display_default: "minimum_output_fps 20"
      tc09: "decoded_fps >= 20, output_fps >= 20, output_resolution == 640x360"
    current:
      level_5: "300kbps/30fps/320x180, all-intra, FEC ratios 5/6"
      level_6: "260kbps/28fps/320x180, all-intra, FEC ratios 7/8"
      level_7: "240kbps/26fps/320x180, all-intra, FEC ratios 10/10"
      level_8: "220kbps/24fps/320x180, all-intra, FEC ratios 12/12"
      display_default: "minimum_output_fps 30"
      tc09: "decoded_fps >= 20, output_fps >= 28, synthetic_fps <= 10, output_resolution == 640x360"
    reason: "The 160x90/30fps 80 percent profile preserved very high true fps but was too blurry. The new high-loss ladder keeps the visually acceptable 320x180 transport baseline, accepts 20-24fps true decoded throughput at the worst point, and uses only a small amount of display supplementation."

  - parameter: fps_first_profile_ladder
    previous:
      interpretation: "20fps was treated as a display/cadence target for many weak-network profiles, and true decoded fps at 80 percent loss targeted the 8-12fps class."
      level_4_to_8: "Levels 4-8 reduced fps to 20, 15, 12, 12, and 10fps while keeping some P-frame profiles in the 45-70 percent loss range."
    current:
      interpretation: "Superseded by loss80_quality_fps_rebalance for Levels 6-8: the source ceiling is still 30fps, but 70-80 percent profiles now trade some true fps for 320x180 visual detail."
      high_loss_policy: "Levels 4-8 use 320x180 all-intra coding and stronger FEC so frame loss does not corrupt the H.264 reference chain."
      tc09: "80 percent steady-loss acceptance now requires post-warmup decoded_fps >= 20, output_fps >= 28, synthetic_fps <= 10, and output_resolution == 640x360."
    reason: "The operator requirement is not fixed 20fps output; it is no-flower video with the highest true decoded fps possible, allowing very blurry transport frames when needed."

  - parameter: file_input_absolute_pacing
    previous: "File mode slept one full source frame interval after decode, scale, x264 encode, FEC sharding, and UDP/SRT send, so a 30fps file produced frame intervals larger than 33ms."
    current: "File mode uses an absolute source-frame deadline pacer on both UDP and SRT paths. Processing and send time are subtracted from the following sleep; if a frame is already late, the pacer resets to the current time instead of burst-sending catch-up frames."
    reason: "Make no-loss file playback match the configured/source fps closely enough for receiver decoded_fps and output_fps to reflect the 30fps profile instead of processing_time + frame_interval pacing."

  - parameter: lowres_transport_20fps_display
    previous:
      transport_constraint: "High-loss profiles still assumed very low true fps, with Level 8 at 30kbps/2fps/256x144 and display minimum_output_fps at 5."
      fec_blocking: "FEC encoder used a fixed minimum of 4 data shards per block, even for tiny emergency frames."
      acceptance_metrics: "Automated acceptance tracked decoded_fps but did not require 20fps display cadence or report synthetic_fps/output_resolution in every scenario summary."
    current:
      final_display_minimum: "640x360 at 30fps by default; 20fps remains the minimum acceptable true decoded floor for extreme 80 percent loss."
      transport_policy: "Superseded by loss80_quality_fps_rebalance: high-loss profiles may transmit below 640x360, and Level 8 now targets 220kbps/24fps/320x180 all-intra with a decoded_fps >= 20 acceptance floor at 80 percent bidirectional loss."
      max_video_kbps_minimum: 60
      fec_blocking: "Superseded by fps_first_profile_ladder: min_data_shards is profile-controlled, with Levels 4-8 using one data shard per block for high-loss all-intra profiles."
      display_processing: "Receiver upscales lower-res decoded frames, applies luma contrast stretch plus sharpen after upscale, and fills display cadence with repeat/blend synthetic frames; 20fps legacy cadence keeps 1ms interval headroom, while the 30fps default uses bounded credit-based supplementation to avoid overproducing synthetic frames."
      acceptance_metrics: "Reports post-warmup decoded_fps, output_fps, synthetic_fps, minimum decoded/output fps, and output_resolution; TC-09 checks the 80 percent steady-loss decoded/output/display targets and caps synthetic_fps at 10."
    reason: "Forcing every transport profile to 640x360/20fps at 80 percent bidirectional loss was unrealistic. The revised target preserves complete CRC-valid H.264 frames while using lower transport resolution and receiver-side display post-processing to keep the operator view stable."

  - parameter: mid_loss_fec_ratios
    previous:
      level_3: {p_frame_fec_ratio: 0.40, keyframe_fec_ratio: 1.00}
      level_4: {p_frame_fec_ratio: 0.75, keyframe_fec_ratio: 2.00}
      level_5: {p_frame_fec_ratio: 1.25, keyframe_fec_ratio: 3.00}
    current:
      level_3: {p_frame_fec_ratio: 0.75, keyframe_fec_ratio: 1.50}
      level_4: {p_frame_fec_ratio: 2.50, keyframe_fec_ratio: 5.00}
      level_5: {p_frame_fec_ratio: 3.00, keyframe_fec_ratio: 6.00}
    reason: "Improve decoded_fps under mid-loss conditions without lowering profile solely because decoded_fps is below the profile fps; the first FEC-only trial improved received frames but did not reach the 80 percent decoded_fps target at 50 percent loss, so Level 4/5 parity was strengthened further."

  - parameter: adaptation_level_5_loss_hysteresis
    previous: "Any smoothed loss above 50 percent immediately selected Level 5, so a 50 percent netem run could oscillate between Level 4 and Level 5 as measured loss jittered around the threshold."
    current: "Level 5 requires three consecutive feedback windows above 55 percent unless loss exceeds 60 percent; Level 5 recovers toward Level 4 only below 50 percent."
    reason: "Keep 50ms/50 percent loss stable at Level 4 while still responding quickly to clearly worse loss."

  - parameter: adaptation_low_mid_loss_hysteresis
    previous: "Any smoothed loss above 15 percent immediately selected Level 2, and recovery followed the current required level without a lower recovery threshold."
    current: "Level 2 loss requires three consecutive feedback windows above 15 percent unless loss exceeds 20 percent; Level 2 recovers toward Level 1 only below 12 percent, and Level 1 recovers to Level 0 only below 3 percent."
    reason: "Reduce Windows profile churn around 10 percent configured loss where sampled loss can briefly cross the 15 percent boundary."

  - parameter: adaptation_rtt_only_degradation
    previous: "RTT-only degradation used a 150 ms Level 3 threshold and required three consecutive high-RTT feedback windows."
    current: "RTT-only degradation uses a 160 ms Level 3 threshold and requires five consecutive high-RTT feedback windows."
    reason: "Filter short Windows scheduling or probe-response spikes while preserving sustained high-RTT protection."

  - parameter: normal_profile_recovery
    previous: "Normal recovery required loss below 5 percent and RTT below 130 ms; non-emergency high-loss profiles could stay stuck after loss improved to 10 percent."
    current: "Normal recovery advances one level every five stable feedback windows whenever the current network-required level is lower than the active profile level."
    reason: "Allow profile recovery on descending congestion stairs such as 0 -> 10 -> 50 -> 10 without waiting for an almost loss-free link."

  - parameter: acceptance_staircase_shape
    previous:
      quick: [0, 20, 45, 80, 0]
      full: [0, 5, 15, 20, 35, 45, 60, 70, 80, 85, 0]
    current:
      quick: [0, 10, 50, 85, 50, 10, 0]
      full: [0, 5, 10, 15, 20, 35, 45, 60, 70, 80, 85, 80, 70, 60, 45, 35, 20, 10, 5, 0]
    reason: "Validate both downshift on increasing loss and profile recovery on gradually decreasing loss instead of jumping directly from high loss to 0 percent."

  - parameter: primary_transport
    previous: "SRT caller/listener was the only media transport."
    current:
      default: udp
      optional: srt
      udp_connection_state: none
    reason: "Remove SRT handshake, peer-idle disconnect, and reconnect delays under 70-80 percent bidirectional loss."

  - parameter: udp_recovery_state
    previous: "A stalled SRT socket forced the normal adaptation controller to Level 8 and then reconnected."
    current:
      trigger: "Feedback timeout after startup grace, receiver frame age above 1500 ms, send congestion, or smoothed loss above 85 percent."
      exit: "A recovery frame is acknowledged by at least two fresh feedback reports; the sender then immediately selects the level implied by current feedback."
      profile: "Level 8: 30kbps/2fps/256x144, one-second GOP, P-frame FEC 8 and keyframe FEC 12."
    reason: "Recover a complete keyframe without waiting for a transport connection."

  - parameter: udp_high_loss_profiles
    previous: "UDP used a separate three-profile table at high loss."
    current:
      loss_70: "Level 6: 80kbps/3fps/320x180, P-frame FEC 2.5, keyframe FEC 5."
      loss_80_to_85: "Level 8: 30kbps/2fps/256x144, P-frame FEC 8, keyframe FEC 12."
      transport_alignment: "UDP and SRT use the same nine-level ladder."
    reason: "Preserve more real motion and spatial detail while keeping complete-frame gaps below three seconds through 85 percent loss."

  - parameter: fec_frame_layout
    previous: "One frame was limited to one Reed-Solomon block and 255 total shards."
    current: "A frame may contain up to 64 independently recoverable blocks; every block has at least four data shards."
    reason: "Support 15-20x parity without limiting encoded frame size to one small block."

  - parameter: protocol_version
    previous: 2
    current: 3
    reason: "Carry UDP session, packet sequence, feedback echo, and multi-block FEC metadata."

  - parameter: netem_neighbor_resolution
    previous: "ARP requests and responses were subjected to the configured netem loss."
    current: "ns-up installs permanent neighbor entries for both veth endpoints."
    reason: "Measure media recovery rather than random ARP cold-start delay at 70-80 percent bidirectional loss."

  - parameter: receiver_display_size
    previous: "The SDL window and texture followed each decoded frame resolution."
    current:
      output_width: 640
      output_height: 360
      scaling: bilinear
      scope: display_only
    reason: "Keep the displayed picture at a stable size while adaptive profiles change encoded resolution."

  - parameter: minimum_display_output
    previous: "Every decoded frame was forced to one fixed 640x360 size and no synthetic output cadence was provided."
    current:
      minimum_resolution: "640x360"
      minimum_fps: 5
      preserve_higher_resolution_and_fps: true
      upscale_modes: [bilinear, lanczos_sharpen]
      interpolation_modes: [repeat, blend]
      defaults: {upscale: lanczos_sharpen, interpolation: blend}
      output_scope: display_only
    reason: "Meet a minimum display specification without reducing decoded video that already exceeds it."

  - parameter: unequal_frame_fec
    previous: "Every frame in a profile used the same parity ratio."
    current: "Each profile has a P-frame FEC ratio and a stronger keyframe FEC ratio."
    reason: "Protect decoder recovery points without applying keyframe-level parity to every P-frame."

  - parameter: udp_feedback_window_counting
    previous: "The same feedback report could be consumed by multiple encoded frames."
    current: "Each UDP feedback sequence updates adaptation at most once."
    reason: "Ensure five-window recovery represents five distinct network feedback windows."

  - parameter: sender_video_input
    previous: "Only a looping local video file was supported."
    current:
      selectable_inputs: [camera, file]
      default_input: file
      camera:
        api: V4L2
        device: /dev/video0
        pixel_format: yuyv422
        width: 640
        height: 480
        fps: 30
      file: "/home/u20/code/jetson-2k.mp4"
    reason: "Transmit live frames from the attached USB camera while retaining file-based test input."

  - parameter: runtime_configuration_source
    previous: "Endpoint, media path, bitrate limit, output path, and display mode were command-line parameters."
    current: "All startup settings have compiled defaults matching runtime-config.yaml; command line accepts only role, and runtime-config.yaml can partially override those defaults."
    reason: "Keep startup behavior reproducible and centralize runtime parameters."

  - parameter: receiver_h264_output
    previous: "The receiver always created and wrote the configured H.264 file."
    current:
      write_h264: true
      output_file: received.h264
    reason: "Allow disabling disk output while preserving decode, display, and statistics; retain writing as the default."

  - parameter: SRTO_PEERIDLETIMEO
    previous: 5000
    current: 15000
    unit: ms
    reason: "Five seconds was too sensitive to temporary silence under 50 percent bidirectional loss."

  - parameter: receiver_receive_stall_threshold
    previous: 2000
    current: 3000
    unit: ms
    reason: "Reduce false 100 percent loss reports during short packet gaps."

  - parameter: reconnect_loss_initialization
    previous: "Clear receiver loss and use the new SRT short-window sender statistic."
    current: "Preserve the last reliable receiver-side loss until a new report arrives."
    reason: "Avoid several seconds of near-100 percent loss immediately after reconnect."

  - parameter: loss_estimation
    previous_stages:
      - "Sender pktSndLoss divided by sent plus lost packets."
      - "Receiver one-second samples, which were unstable at low bitrate."
      - "Five-second rolling window with at least 100 packets."
      - "Ten-second rolling window with at least 200 packets."
    current: "Receiver cumulative batches of at least 400 resolved original packets."
    reason: "Track injected link loss without retransmission-window skew or small-sample spikes."

  - parameter: loss_estimator_stall_handling
    previous: "Keep the stalled interval in the next loss batch."
    current: "Report 100 percent while stalled, then reset the batch when packet progress resumes."
    reason: "Prevent the first post-stall report from remaining close to 100 percent."

  - parameter: emergency_profile_recovery
    previous: "All recovery required loss below 3 percent and RTT below 130 ms."
    current: "An emergency Level 8 can recover every five stable windows to the level required by the current network."
    reason: "Prevent a temporary stall or WouldBlock event from permanently trapping video at the emergency level."

  - parameter: adaptation_ladder
    previous_profiles:
      - {level: 0, bitrate_kbps: 2000, fps: 30, width: 1280, height: 720, fec_ratio: 0.15, all_intra: false}
      - {level: 1, bitrate_kbps: 1200, fps: 24, width: 960, height: 540, fec_ratio: 0.25, all_intra: false}
      - {level: 2, bitrate_kbps: 600, fps: 15, width: 640, height: 360, fec_ratio: 0.50, all_intra: false}
      - {level: 3, bitrate_kbps: 300, fps: 10, width: 426, height: 240, fec_ratio: 1.00, all_intra: false}
      - {level: 4, bitrate_kbps: 150, fps: 5, width: 320, height: 180, fec_ratio: 1.50, all_intra: false}
      - {level: 5, bitrate_kbps: 50, fps: 2, width: 160, height: 90, fec_ratio: 3.00, all_intra: true}
      - {level: 6, bitrate_kbps: 8, fps: 1, width: 128, height: 72, fec_ratio: 11.00, all_intra: true}
    current_profile_count: 9
    reason: "Prefer bitrate and frame-rate reductions before large resolution changes, while retaining three emergency levels."

  - parameter: rtt_level_mapping
    previous:
      - {greater_than_ms: 150, minimum_level: 2}
      - {greater_than_ms: 220, minimum_level: 4}
      - {greater_than_ms: 350, minimum_level: 5}
    current:
      - {greater_than_ms: 150, minimum_level: 3}
      - {greater_than_ms: 220, minimum_level: 5}
      - {greater_than_ms: 300, minimum_level: 6}
      - {greater_than_ms: 400, minimum_level: 7}

  - parameter: latency_metric_reporting
    previous: "Only SRT RTT was reported; no media one-way latency metric."
    current: "Select exactly one of encode_to_assemble, encode_to_decode, or source_to_display; default encode_to_decode."
    rolling_window_seconds: 10
    outputs: [latency_avg, latency_invalid]
    reason: "Separate SRT round-trip time from media pipeline latency without affecting adaptation."

  - parameter: media_timestamp_protocol
    previous: {protocol_version: 1, timestamp: steady_clock_pts_us}
    current:
      protocol_version: 2
      encoded_timestamp: encoded_at_unix_us
      source_processing_duration: source_to_encoded_us
    reason: "Support one-way latency measurement across NTP/PTP-synchronized hosts."

  - parameter: latency_sample_validation
    previous: "No media latency validation."
    current:
      maximum_valid_sample_ms: 60000
      negative_sample_action: discard
      invalid_counter: latency_invalid
    reason: "Reject clock jumps, synchronization errors, and malformed timestamps."

  - parameter: receiver_frame_continuity_gate
    previous: "Any complete CRC-valid P-frame could be decoded after a missing reference frame."
    current: "A frame ID gap clears decoder synchronization; non-keyframes are dropped until the next complete keyframe."
    reason: "Prevent decoder errors and corrupted reference chains during abrupt packet loss."

  - parameter: periodic_log_fields
    previous:
      sender: [transport]
      receiver: [transport, latency_type, latency_p95, output_fps, synthetic_fps, output_resolution]
    current:
      sender_removed: [transport]
      receiver_removed: [transport, latency_type, output_fps, synthetic_fps, output_resolution]
      retained_debug: [srt_events, udp_events, decoded_fps, last_frame_age_ms, max_frame_gap_ms, decoder_errors, latency_avg, latency_p95, latency_max, latency_samples]
    reason: "Reduce repetitive output while retaining connection, latency distribution, and frame-stall diagnostics."

  - parameter: receiver_latency_log_fields
    previous: "Receiver periodic logs printed latency_avg and latency_invalid only."
    current: "Receiver periodic logs print latency_avg, latency_p95, latency_max, latency_samples, and latency_invalid."
    reason: "Allow automated acceptance to report latency distribution while preserving latency_avg for the TC-08 hard criterion."

  - parameter: automated_acceptance_runner
    previous: "Weak-network acceptance was run manually with scripts/netem_loss.sh, ad hoc logs, and manual FFmpeg checks."
    current: "scripts/weaknet_acceptance.py automates namespace setup, sender/receiver launch, netem scenarios, log capture, FFmpeg/ffprobe checks, and JSON/Markdown reporting."
    reason: "Make TC-01 through TC-08 validation repeatable and preserve evidence for each scenario."

  - parameter: tc08_acceptance_threshold
    previous: "The plan treated 180-500 ms as a closed interval for latency_avg."
    current: "Automated acceptance fails only when latency_avg exceeds 500 ms; latency below 180 ms is reported as better-than-target latency."
    reason: "Local namespace encode-to-decode latency can be well below 180 ms, and lower latency should not fail weak-network acceptance."

  - parameter: sender_last_frame_age_log
    previous: "Sender UDP statistics printed the receiver-reported last_frame_age_ms."
    current: "The field remains in UDP feedback and recovery control but is no longer printed by the sender."
    reason: "Keep sender output concise while preserving receiver-side frame-age diagnostics and adaptation behavior."

  - parameter: udp_recovery_exit_profile
    previous: "After cold-start recovery, the adaptation controller remained at Level 8 and recovered one level per five healthy feedback windows."
    current: "After a recovery frame is acknowledged, the controller immediately resets to the level required by fresh feedback; 0 percent loss and low RTT selects Level 0."
    reason: "Avoid normal 0-loss startup being stuck at 30kbps/2fps/256x144 while preserving Level 8 for no-feedback recovery."

  - parameter: udp_recovery_frame_tracking
    previous: "While recovering, each successful send refreshed the recovery frame ID and feedback baseline."
    current: "The first successfully sent recovery frame is kept as the acknowledgement target until recovery exits or send congestion restarts recovery."
    reason: "Prevent the recovery target from moving forward forever, which kept 0-loss startup at Level 8."

  - parameter: udp_startup_profile
    previous: "UDP startup forced Level 8 before any feedback was received."
    current: "UDP startup begins at the normal adaptation profile; missing feedback after the feedback timeout uses a transient Level 8 probe profile without entering recovery or forcing the adaptation controller to emergency."
    reason: "Make 0-loss, low-latency startup use 1280x720/30fps instead of briefly reporting 30kbps/2fps/256x144."

  - parameter: udp_missing_feedback_recovery_gate
    previous: "After the feedback timeout, missing UDP feedback was treated as recovery_required even when no receiver feedback had ever been observed."
    current: "Feedback timeout starts recovery only after at least one receiver feedback has been observed; before that, the sender may send transient low-rate probe frames while preserving the normal adaptation state."
    reason: "Avoid sender-first startup being mistaken for severe loss while retaining low-rate probes for lossy cold-start paths."

  - parameter: udp_rtt_measurement
    previous: "UDP feedback echoed the most recent media shard sent_monotonic_us, so low frame rate, receiver scheduling, or media processing delay could inflate rtt_ms and affect adaptation."
    current: "Sender emits independent UDP probe messages from the UDP feedback/control thread at the feedback interval; receiver echoes the latest probe sender_monotonic_us in UdpFeedback, and adaptation RTT is computed from that control-plane echo."
    reason: "Prevent media cadence and receiver decode/render timing from making a healthy link look like high RTT."

  - parameter: udp_probe_scheduler
    previous: "UDP probes were sent by the sender media loop, so file EOF/reset or encoder reconfiguration could delay new probes and make the echoed probe timestamp look like high RTT."
    current: "UDP probes are sent by the feedback/control thread, independent of frame reading and encoder lifecycle."
    reason: "Keep RTT measurement on the control plane even when the media path stalls briefly on a healthy local link."

  - parameter: adaptation_loss_thresholds
    previous: "Loss thresholds used fine-grained low-loss cuts at 3, 7, and 15 percent before the unchanged high-loss thresholds."
    current: "Low-loss thresholds are widened to 5, 15, and 20 percent while 30, 50, 65, 72, and 77 percent thresholds remain unchanged."
    reason: "Keep 10 percent loss in a 20fps profile and avoid unnecessary drops to 15fps while preserving strong protection for common 20 percent-plus weak-network cases."

  - parameter: adaptation_rtt_only_degradation
    previous: "A single RTT sample above 150, 220, 300, or 400 ms could immediately force the corresponding minimum profile level."
    current: "RTT-only degradation requires three consecutive high-RTT feedback windows; loss-required levels still apply immediately."
    reason: "Filter Windows scheduler and control-thread RTT spikes without removing sustained high-RTT protection."

  - parameter: protocol_version
    previous: 3
    current: 4
    reason: "Add UDP probe messages and change UdpFeedback echoed_sender_monotonic_us semantics without supporting mixed old/new endpoints."

  - parameter: low_loss_realtime_profiles
    previous:
      level_1: {bitrate_kbps: 1200, fps: 20, width: 960, height: 540, gop_frames: 20, p_frame_fec_ratio: 0.15, keyframe_fec_ratio: 0.50}
      level_2: {bitrate_kbps: 700, fps: 15, width: 640, height: 360, gop_frames: 15, p_frame_fec_ratio: 0.25, keyframe_fec_ratio: 0.75}
    current:
      level_1: {bitrate_kbps: 900, fps: 20, width: 640, height: 360, gop_frames: 10, p_frame_fec_ratio: 0.50, keyframe_fec_ratio: 0.75}
      level_2: {bitrate_kbps: 700, fps: 15, width: 640, height: 360, gop_frames: 8, p_frame_fec_ratio: 0.50, keyframe_fec_ratio: 0.75}
    reason: "Improve true decoded frame continuity around 10-15 percent loss by protecting P frames and reducing keyframe wait time."

  - parameter: receiver_keyframe_request
    previous: "UDP feedback requested a keyframe only when last_frame_age_ms exceeded 1500."
    current: "UDP feedback also requests a keyframe after frame assembly expiry, H.264 sync loss from a frame ID gap, decoder error, or dropping non-keyframes while unsynchronized."
    reason: "Shorten recovery after a missing P frame without relaxing complete-frame and decoder-sync gates."

  - parameter: sender_keyframe_request_handling
    previous: "Any UDP feedback request_keyframe was treated as receiver_stalled and could force Level 8 recovery."
    current: "request_keyframe triggers the next encoded frame to be an IDR; Level 8 recovery is reserved for stale feedback, last_frame_age_ms above 1500, send congestion, or very high loss."
    reason: "Allow mid-loss H.264 resynchronization without unnecessary emergency-profile drops."

